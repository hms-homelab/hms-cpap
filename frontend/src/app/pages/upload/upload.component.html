<div class="upload-page">
  <h1><i class="fa-solid fa-cloud-arrow-up"></i> {{ 'upload.title' | translate }}</h1>

  <!-- CPAP compressed files -->
  <section class="card">
    <h2>{{ 'upload.zip.heading' | translate }}</h2>
    <p class="hint">{{ 'upload.zip.hint' | translate }}</p>

    <label class="drop-zone"
           [class.dragover]="zipDrag"
           (dragover)="$event.preventDefault(); zipDrag = true"
           (dragleave)="zipDrag = false"
           (drop)="onZipDrop($event)">
      <input type="file" accept=".zip" hidden (change)="onZipPick($event)" />
      <ng-container [ngSwitch]="zipState">
        <span *ngSwitchCase="'idle'"><i class="fa-solid fa-folder-zip"></i> {{ 'upload.zip.idle' | translate }}</span>
        <span *ngSwitchCase="'uploading'"><i class="fa-solid fa-spinner fa-spin"></i> {{ 'upload.zip.uploading' | translate }}</span>
        <!-- zipStatusText is progress text from the server, English-only. -->
        <span *ngSwitchCase="'processing'"><i class="fa-solid fa-spinner fa-spin"></i> {{ zipStatusText }}</span>
        <span *ngSwitchCase="'complete'" class="ok"><i class="fa-solid fa-check"></i> {{ 'upload.zip.imported' | translate:{ count: zipDates.length } }}</span>
        <span *ngSwitchCase="'error'" class="err"><i class="fa-solid fa-triangle-exclamation"></i> {{ zipError }}</span>
      </ng-container>
    </label>

    <div class="dates" *ngIf="zipDates.length">
      {{ zipDates.join(', ') }}
    </div>
  </section>

  <!-- O2Ring oximetry -->
  <section class="card">
    <h2>{{ 'upload.oxi.heading' | translate }}</h2>
    <p class="hint">
      {{ 'upload.oxi.hintPre' | translate }} &rarr; {{ 'upload.oxi.hintPost' | translate }}
    </p>

    <label class="drop-zone"
           [class.dragover]="oxiDrag"
           (dragover)="$event.preventDefault(); oxiDrag = true"
           (dragleave)="oxiDrag = false"
           (drop)="onOxiDrop($event)">
      <input type="file" accept=".csv" hidden (change)="onOxiPick($event)" />
      <ng-container [ngSwitch]="oxiState">
        <span *ngSwitchCase="'idle'"><i class="fa-solid fa-heart-pulse"></i> {{ 'upload.oxi.idle' | translate }}</span>
        <span *ngSwitchCase="'uploading'"><i class="fa-solid fa-spinner fa-spin"></i> {{ 'upload.oxi.importing' | translate }}</span>
        <span *ngSwitchCase="'complete'" class="ok"><i class="fa-solid fa-check"></i> {{ 'upload.oxi.result' | translate:{ samples: oxiSamples, avg: (oxiAvgSpo2 | number:'1.1-1') } }}</span>
        <span *ngSwitchCase="'error'" class="err"><i class="fa-solid fa-triangle-exclamation"></i> {{ oxiError }}</span>
      </ng-container>
    </label>
  </section>
</div>
