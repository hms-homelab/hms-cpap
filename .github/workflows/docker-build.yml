name: Build, Test, and Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  # Manual trigger to rebuild/verify native artifacts without cutting a tag.
  # The release job stays tag-gated and the Docker push is 'push'-gated, so a
  # manual run is build-and-test only (no image publish, no GitHub release).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Linux Build + Docker ──────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Angular UI ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Angular UI
        working-directory: frontend
        run: npx ng build --configuration production

      # ── C++ Build + Tests ───────────────────────────────────────
      - name: Install C++ dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libcurl4-openssl-dev libpq-dev libpqxx-dev libssl-dev \
            libjsoncpp-dev libpaho-mqtt-dev libpaho-mqttpp-dev \
            nlohmann-json3-dev libspdlog-dev libsqlite3-dev \
            libdrogon-dev libgtest-dev libgmock-dev \
            uuid-dev libmariadb-dev libhiredis-dev libbrotli-dev \
            libyaml-cpp-dev zlib1g-dev \
            libhpdf-dev gnuplot

      - name: Build HMS-CPAP
        run: |
          mkdir build && cd build
          cmake -DBUILD_TESTS=ON -DBUILD_WITH_WEB=ON -DBUILD_WITH_MYSQL=ON ..
          make -j$(nproc)

      - name: Run tests
        # Unit gate: skip the flaky / broker-dependent integration suites. They
        # drive real TCP sockets (FysetcTcpServer flakes under CI load) or need a
        # live MQTT broker (the MQTT suites GTEST_SKIP without one). They run in a
        # dedicated integration env, not the unit gate. Mirrors the coverage job's
        # exclusion; pure-logic suites (e.g. FysetcLifecycle) stay in.
        run: cd build && ./tests/run_tests --gtest_filter='-FysetcTcpServerTest.*:MqttClientTest.*:STRMqttIntegrationTest.*:SummaryRegenerationE2ETest.*'

      # ── Copy UI into build output ──────────────────────────────
      - name: Bundle UI with binary
        run: |
          mkdir -p build/static/browser
          cp -r frontend/dist/frontend/browser/* build/static/browser/

      # ── Docker Image ────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name == 'push'
        run: echo ${{ steps.meta.outputs.digest }}

      - name: Make GHCR package public
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            orgs/${{ github.repository_owner }}/packages/container/hms-cpap \
            -f visibility=public || echo "Could not set visibility (may need org admin token)"

  # ── Code Coverage (gcov/lcov) ─────────────────────────────────────
  # Ratchet gate: raise COVERAGE_MIN as test batches land. At 80% (2026-06).
  # Networking E2E suites are excluded by scripts/coverage.sh (they race /
  # segfault under -O0 instrumentation and need a live broker); they still run
  # in the build-and-test job above.
  coverage:
    runs-on: ubuntu-latest
    # Postgres so the DatabaseService (pqxx) suite runs here too instead of
    # GTEST_SKIPping (it isolates each test in a throwaway schema). Creds match
    # the suite's defaults so it connects with no extra wiring.
    services:
      postgres:
        # pgvector image so the AgentMemory pgvector tests run (CREATE EXTENSION
        # vector) instead of skipping — recovers AgentMemory coverage.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: REDACTED
          POSTGRES_DB: cpap_monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COVERAGE_MIN: "80"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: maestro
      PGPASSWORD: REDACTED
      PGDATABASE: cpap_monitoring
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libcurl4-openssl-dev libpq-dev libpqxx-dev libssl-dev \
            libjsoncpp-dev libpaho-mqtt-dev libpaho-mqttpp-dev \
            nlohmann-json3-dev libspdlog-dev libsqlite3-dev \
            libdrogon-dev libgtest-dev libgmock-dev \
            uuid-dev libmariadb-dev libhiredis-dev libbrotli-dev \
            libyaml-cpp-dev zlib1g-dev \
            libhpdf-dev gnuplot lcov

      - name: Run coverage (build instrumented, run tests, enforce ratchet)
        run: bash scripts/coverage.sh "$COVERAGE_MIN"

      - name: Coverage summary to job log
        if: always()
        run: |
          if [ -f coverage/coverage.info ]; then
            { echo '### hms-cpap coverage'; echo '```'; \
              lcov --summary coverage/coverage.info 2>/dev/null \
                --ignore-errors empty,unused,inconsistent || true; \
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          if-no-files-found: ignore

  # ── Windows Build ─────────────────────────────────────────────────
  windows-build:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      # Lifted to JOB level on purpose. A step's own `env:` block is not visible
      # to that same step's `if:` expression, so guarding the signing steps on a
      # step-local variable would silently evaluate to empty and skip forever,
      # which is indistinguishable from "no certificate configured".
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pin CMake 3.31 (vcpkg Drogon incompatible with CMake 4.x)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # ── Angular UI ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Angular UI
        working-directory: frontend
        run: npx ng build --configuration production

      # ── vcpkg + C++ Build ───────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-win-x64-static-md-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-x64-static-md-

      - name: Install vcpkg dependencies
        run: |
          vcpkg install --triplet x64-windows-static-md

      # SDD-016: the supervisor is a Qt application and ships in the same
      # installer as the service, so the same job builds both. Cached by the
      # action, which matters: this is ~600MB cold.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Build HMS-CPAP (MSVC)
        run: |
          mkdir build
          cd build
          # MySQL comes from the vcpkg libmysql port. pkg-config is not present
          # under MSVC, so CMakeLists falls back to its find_path/find_library
          # route; the toolchain file puts the vcpkg tree on the search path.
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DBUILD_TESTS=OFF -DBUILD_WITH_WEB=ON -DBUILD_WITH_POSTGRESQL=ON -DBUILD_WITH_MYSQL=ON `
            -DBUILD_SUPERVISOR=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ..
          cmake --build . --parallel

      # ── Package Windows release ─────────────────────────────────
      - name: Bundle release
        run: |
          mkdir release
          Copy-Item build\hms_cpap.exe release\
          # Copy any DLLs
          Get-ChildItem -Path build\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination release\

          # The MSVC C++ runtime, shipped next to the exe.
          #
          # The vcpkg triplet is x64-windows-static-md: static libraries but the
          # DYNAMIC CRT, so hms_cpap.exe imports VCRUNTIME140.dll and MSVCP140.dll
          # and cannot start without them. This runner has them because Visual
          # Studio is installed. A CPAP patient's laptop very often does not.
          #
          # What that looked like: hms_cpap.exe put up a modal "VCRUNTIME140.dll
          # was not found" box, and because the installer runs it during setup and
          # waits, Setup hung forever on a dialog no silent install can click.
          # Confirmed on a clean Windows 11 machine.
          #
          # App-local deployment rather than bundling vc_redist.exe, because the
          # redistributable installs machine-wide and needs elevation, and this
          # installer is per-user with PrivilegesRequired=lowest on purpose. The
          # loader checks the executable's own directory first, so copying the
          # DLLs beside it is enough and costs no UAC prompt. The installer already
          # ships dist-windows\*.dll, so landing them here is all that is needed.
          $redist = $env:VCToolsRedistDir
          if (-not $redist) {
            $redist = (Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*' `
                         -Directory -ErrorAction SilentlyContinue |
                       Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          $crt = $null
          if ($redist) {
            $crt = Get-ChildItem (Join-Path $redist 'x64') -Filter 'Microsoft.VC*.CRT' `
                     -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1
          }
          # Fail the build rather than publish an installer that hangs on a clean
          # machine. A silently missing runtime is the exact failure this exists
          # to prevent, so it must not degrade quietly.
          if (-not $crt) { throw "MSVC CRT redistributable DLLs not found (VCToolsRedistDir='$redist')" }
          Write-Host "bundling CRT from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" release\
          Get-ChildItem release\*.dll | ForEach-Object { Write-Host "  $($_.Name)" }
          # Bundle Angular UI
          mkdir release\static\browser -Force
          Copy-Item -Recurse frontend\dist\frontend\browser\* release\static\browser\
          # Sample config
          @'
          {
            "device_id": "cpap_resmed_SERIAL",
            "device_name": "ResMed AirSense 10",
            "source": "ezshare",
            "ezshare_url": "http://192.168.4.1",
            "burst_interval": 65,
            "web_port": 8893,
            "database": { "type": "sqlite" },
            "mqtt": { "enabled": false }
          }
          '@ | Out-File -Encoding utf8 release\config.example.json

      # ── SDD-005 phase 3: tray shell + installer ─────────────────
      # Both steps are continue-on-error so a desktop-packaging problem
      # degrades to "zip only" rather than taking down the whole Windows
      # artifact, which is what the release job actually needs.
      - name: Stage the supervisor and service
        id: tray
        continue-on-error: true
        run: |
          # Staging dir the installer script reads from, mirroring the install
          # layout: shell and service side by side.
          mkdir dist-windows -Force
          Copy-Item build\desktop\qt\CpapDashDesktop.exe dist-windows\
          Copy-Item -Recurse -Force release\* dist-windows\

          # Everything Qt needs, next to the exe. The requirement is that a user
          # installs NOTHING of their own -- no Qt runtime, no redistributable --
          # so the DLLs and the platform plugins travel inside the installer the
          # same way the MSVC CRT already does.
          #
          # --no-translations and --no-system-d3d-compiler keep out ~10MB the
          # supervisor never loads.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw dist-windows\CpapDashDesktop.exe

          # A missing platform plugin is silent at build time and fatal at run
          # time ("no Qt platform plugin could be initialized"), so it is checked
          # here rather than discovered by whoever installs it.
          if (-not (Test-Path dist-windows\platforms\qwindows.dll)) {
            throw "windeployqt did not produce platforms\qwindows.dll"
          }

      - name: Sign binaries
        id: sign
        continue-on-error: true
        # Skipped entirely until the OV certificate exists. Guarding on the
        # secret rather than failing keeps forks and PRs building, and means
        # adding the cert later needs no workflow change.
        if: steps.tray.outcome == 'success' && env.WINDOWS_CERT_PFX != ''
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          # Every binary that ships, not just the two executables. SmartScreen
          # reputation is per-publisher across a bundle, and an unsigned Qt DLL
          # beside a signed exe is a support ticket.
          $targets = @('dist-windows\CpapDashDesktop.exe','dist-windows\hms_cpap.exe') +
                     (Get-ChildItem dist-windows -Recurse -Include *.dll | ForEach-Object FullName)
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 @targets
          Remove-Item cert.pfx

      - name: Build installer
        id: installer
        continue-on-error: true
        if: steps.tray.outcome == 'success'
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" /O"$PWD\dist-installer" desktop\windows\installer.iss

      - name: Sign installer
        continue-on-error: true
        if: steps.installer.outcome == 'success' && env.WINDOWS_CERT_PFX != ''
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist-installer\CpapDashDesktop-Setup.exe
          Remove-Item cert.pfx

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hms-cpap-windows-x64
          path: release/

      - name: Upload Windows installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cpapdash-desktop-setup
          path: dist-installer/

  # ── Windows desktop: RUN it, do not just build it ────────────────
  #
  # Compiling proves the C# is syntactically valid and that Inno produced a file.
  # It proves nothing about whether the installer installs, whether the tray can
  # start the service, or whether uninstalling leaves a user's therapy database
  # alone. This job exercises all of that on a real Windows machine.
  #
  # NOT continue-on-error: this is a test. If it fails, the honest signal is a
  # red job, not a quietly skipped step.
  windows-desktop-test:
    runs-on: windows-latest
    needs: windows-build
    # This job installs and uninstalls a real program, so every step either
    # finishes in seconds or is stuck. Without a bound it hangs until the 6 hour
    # run cap, and GitHub refuses to serve step logs until the whole run
    # finishes, so a hang costs an afternoon AND tells you nothing. Observed on
    # the v4.9.6 tag: "Install silently" sat for 4h54m while every other job had
    # long since passed.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: cpapdash-desktop-setup
          path: installer/

      - name: Install silently
        # Bounded separately from the job so a hang here is named rather than
        # inferred: Start-Process -Wait blocks forever if Setup puts up any
        # interactive surface, and this step is the only one that can.
        timeout-minutes: 5
        run: |
          $exe = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          Write-Host "installing $exe"
          # /TASKS selects the Start at Login task so the Run key is exercised too.
          #
          # /CURRENTUSER is not optional here. installer.iss sets
          # PrivilegesRequiredOverridesAllowed=dialog, so Setup wants to be told
          # which install mode to use, and the only non-interactive way to answer
          # is /ALLUSERS or /CURRENTUSER. Without one it can sit waiting on a
          # dialog that nobody will ever click: observed twice on the v4.9.6 tag,
          # where Setup and Setup.tmp stayed alive producing no output until the
          # job was killed. /CURRENTUSER matches the installer's own stated design,
          # which is a per-user install with PrivilegesRequired=lowest.
          $p = Start-Process -FilePath $exe -Wait -PassThru `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=startatlogin'
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

      - name: The installed layout is what the shell expects
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"
          # The tray finds hms_cpap.exe by sitting next to it, so this layout IS
          # the contract between the two.
          foreach ($f in @('CpapDashDesktop.exe','hms_cpap.exe','static\browser\index.html','platforms\qwindows.dll')) {
            if (-not (Test-Path "$app\$f")) { throw "missing after install: $f" }
            Write-Host "  ok $f"
          }

      - name: Start at Login wrote a usable Run entry
        run: |
          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
                  -Name CpapDashDesktop -ErrorAction SilentlyContinue).CpapDashDesktop
          if (-not $v) { throw 'Run value CpapDashDesktop was not created' }
          # Quoted, or a path containing a space starts the wrong program.
          if (-not $v.StartsWith('"')) { throw "Run value is not quoted: $v" }
          Write-Host "  ok $v"

      - name: Preflight passes on a clean machine
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"
          $out = & "$app\hms_cpap.exe" --preflight 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "preflight failed on a clean machine: $out" }
          foreach ($c in @('data_dir','web_port','database')) {
            if ($out -notmatch $c) { throw "preflight report never mentioned $c" }
          }

      - name: Preflight FAILS when the port is genuinely taken
        run: |
          # The whole reason preflight exists. Bind 8893 for real and require
          # that the check notices and names it.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 8893)
          $listener.Start()
          try {
            $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"
            $out = & "$app\hms_cpap.exe" --preflight 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -eq 0)               { throw 'preflight passed while 8893 was bound' }
            if ($out -notmatch '8893')     { throw 'the report never named the port' }
            if ($out -notmatch 'web_port') { throw 'the report never named the setting to change' }
            Write-Host '  ok preflight refused, and named both the port and the setting'
          } finally {
            $listener.Stop()
          }
          # A non-zero exit from hms_cpap is the EXPECTED result here, but GitHub
          # fails a pwsh step whose $LASTEXITCODE is still non-zero at the end,
          # so a passing test reported as red.
          exit 0

      - name: The tray starts the service and it actually serves
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"
          $tray = Start-Process -FilePath "$app\CpapDashDesktop.exe" -PassThru
          Start-Sleep -Seconds 20

          if ($tray.HasExited) { throw "the tray exited immediately (code $($tray.ExitCode))" }

          # The point of the shell: it spawns the child.
          $child = Get-Process hms_cpap -ErrorAction SilentlyContinue
          if (-not $child) { throw 'the tray never started hms_cpap' }
          Write-Host "  ok tray pid $($tray.Id), child pid $($child.Id)"

          # And the child is really serving, not merely running.
          $ok = $false
          foreach ($i in 1..15) {
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:8893/health' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { Write-Host "  ok /health: $($r.Content)"; $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw '/health never answered' }

          # FORCE kill: the case Supervisor.Stop() can never handle, because
          # TerminateProcess skips every finally block in the runtime. Only the
          # job object saves us here, and this assertion is what caught its
          # absence.
          Stop-Process -Id $tray.Id -Force
          Start-Sleep -Seconds 8
          $orphan = Get-Process hms_cpap -ErrorAction SilentlyContinue
          if ($orphan) {
            Stop-Process -Name hms_cpap -Force -ErrorAction SilentlyContinue
            throw 'hms_cpap outlived a FORCE-KILLED tray; it would hold port 8893'
          }
          Write-Host '  ok no orphan after a forced kill'

          # And the ordinary path, which most people actually take: start again
          # and close the window politely. Covering only the violent case would
          # leave the common one untested.
          # Prove the port is actually free before blaming the tray. If the
          # previous instance left 8893 unusable, preflight refuses and the tray
          # sits on its dialog, which looks identical to "the tray is broken".
          $pf = & "$app\hms_cpap.exe" --preflight 2>&1 | Out-String
          $pfCode = $LASTEXITCODE
          Write-Host "preflight after the forced kill (exit $pfCode):"
          Write-Host $pf
          if ($pfCode -ne 0) {
            throw "the port did not come back after killing the previous instance"
          }

          $tray2 = Start-Process -FilePath "$app\CpapDashDesktop.exe" -PassThru
          # Polled, not a fixed sleep: the child now starts only after preflight
          # runs, so a single guess at the delay is fragile.
          $started = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($tray2.HasExited) { throw "the tray exited on its second run (code $($tray2.ExitCode))" }
            if (Get-Process hms_cpap -ErrorAction SilentlyContinue) { $started = $true; break }
          }
          if (-not $started) {
            throw 'the tray did not restart hms_cpap on a second run within 60s'
          }
          Write-Host '  ok the tray restarted the service'
          $tray2.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 5
          if (-not $tray2.HasExited) { Stop-Process -Id $tray2.Id -Force }
          Start-Sleep -Seconds 8
          $orphan2 = Get-Process hms_cpap -ErrorAction SilentlyContinue
          if ($orphan2) {
            Stop-Process -Name hms_cpap -Force -ErrorAction SilentlyContinue
            throw 'hms_cpap outlived a normally-closed tray'
          }
          Write-Host '  ok no orphan after a normal close'

      # The promise is that a user installs nothing of their own -- no Qt, no
      # runtime, no separate download. Two things make that testable rather than
      # hoped for.
      #
      # First, THIS JOB IS THE CLEAN ROOM: it runs on a fresh windows-latest
      # runner that only downloads the installer artifact. Qt is installed in
      # windows-build, a different job on a different machine, so nothing here
      # can be borrowed from a developer toolchain.
      #
      # Second, and more precisely: ask the LIVE process where its modules came
      # from. "It ran on a machine we believe was clean" is only as strong as the
      # belief; enumerating loaded DLLs is direct evidence, and it stays valid on
      # a machine that DOES have Qt -- which is exactly where a borrowed library
      # would hide.
      #
      # Shell extensions (OneDrive, ink/tablet input) are injected into every GUI
      # process by Windows itself. They are not dependencies and their absence
      # changes nothing, so the assertion is scoped to the libraries we ship.
      - name: The application borrows nothing from outside its own folder
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"

          $p = Start-Process "$app\CpapDashDesktop.exe" -PassThru
          Start-Sleep -Seconds 18
          if ($p.HasExited) { throw "the supervisor exited during the dependency check" }

          $p.Refresh()
          $mods = $p.Modules | ForEach-Object { $_.FileName }
          Write-Host "  $($mods.Count) modules loaded"

          # Everything we ship, wherever it was loaded from.
          $ours = $mods | Where-Object { $_ -match 'Qt6|msvcp|vcruntime|concrt' }
          if (-not $ours) { throw "no Qt modules loaded at all - is this the right binary?" }

          $borrowed = $ours | Where-Object { $_ -notlike "$app*" }
          if ($borrowed) {
            Write-Host "  borrowed from outside the installation:"
            $borrowed | ForEach-Object { Write-Host "    $_" }
            throw "the application is loading libraries it does not ship; a user without them would get a broken install"
          }

          Write-Host "  ok every shipped library loaded from $app"
          $ours | ForEach-Object { Write-Host "    $(Split-Path $_ -Leaf)" }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (Get-Process hms_cpap -ErrorAction SilentlyContinue) {
            throw "the service outlived the supervisor during the dependency check"
          }

      - name: Uninstall removes the program and the Run key
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HMS-CPAP"
          # Prove the data directory survives: this is a therapy database, and an
          # uninstaller that removes it turns a reinstall into permanent loss.
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.hms-cpap" | Out-Null
          Set-Content "$env:USERPROFILE\.hms-cpap\config.json" '{"marker":"keep me"}'

          $unins = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw 'no uninstaller was installed' }
          $p = Start-Process -FilePath $unins.FullName -Wait -PassThru `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Sleep -Seconds 5

          if (Test-Path "$app\CpapDashDesktop.exe") { throw 'the shell survived uninstall' }

          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
                  -Name CpapDashDesktop -ErrorAction SilentlyContinue).CpapDashDesktop
          if ($v) { throw "uninstall left a Run entry pointing at a deleted file: $v" }

          if (-not (Test-Path "$env:USERPROFILE\.hms-cpap\config.json")) {
            throw 'THE UNINSTALLER DELETED THE USER DATA DIRECTORY'
          }
          Write-Host '  ok program gone, Run key gone, ~/.hms-cpap intact'

  # ── macOS Build (Apple Silicon / arm64) ───────────────────────────
  # GitHub-hosted arm64 runner (free for public repos). Produces the
  # hms-cpap-macos-arm64.zip that used to be built and uploaded by hand.
  # Dep list mirrors what satisfies the local macOS build (Homebrew), with
  # the one exception that the paho MQTT C++ wrapper has no Homebrew formula
  # and is built from source below.
  macos-build:
    runs-on: macos-14
    continue-on-error: true    # optional, like windows-build: release still ships if this fails
    permissions:
      contents: read

    env:
      # find_package(OpenSSL) needs the keg-only openssl@3, not the system LibreSSL.
      OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Angular UI ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Angular UI
        working-directory: frontend
        run: npx ng build --configuration production

      # ── C++ dependencies (Homebrew) ─────────────────────────────
      # Mirrors the local macOS build's resolved deps. CURL comes from the
      # macOS SDK (system libcurl.tbd) so it is not installed here.
      - name: Install C++ dependencies (Homebrew)
        run: |
          brew install cmake ninja drogon jsoncpp openssl@3 libpq libpqxx \
            spdlog nlohmann-json libharu gnuplot hiredis brotli yaml-cpp sqlite \
            mysql-client

      # ── Paho MQTT C++ (no Homebrew formula — build from source) ──
      # hms-cpap links paho-mqttpp3 (C++) + paho-mqtt3as (async+SSL C). The C++
      # wrapper is not packaged by Homebrew, so build it with its bundled C lib
      # (PAHO_WITH_MQTT_C=ON) and install into the Homebrew prefix so the main
      # build's find_library() calls resolve both libs.
      - name: Build and install paho.mqtt.cpp
        run: |
          # --recurse-submodules: PAHO_WITH_MQTT_C=ON builds the bundled C lib from
          # the externals/paho-mqtt-c submodule, which is empty without this.
          git clone --depth 1 --branch v1.5.2 --recurse-submodules --shallow-submodules \
            https://github.com/eclipse/paho.mqtt.cpp.git
          cmake -S paho.mqtt.cpp -B paho.mqtt.cpp/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/homebrew \
            -DPAHO_WITH_MQTT_C=ON \
            -DPAHO_WITH_SSL=ON \
            -DPAHO_BUILD_SHARED=ON \
            -DPAHO_BUILD_STATIC=OFF \
            -DPAHO_ENABLE_TESTING=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build paho.mqtt.cpp/build
          sudo cmake --install paho.mqtt.cpp/build

      # ── C++ Build (native arm64) ────────────────────────────────
      # C++20 because Homebrew libpqxx is built for C++20 (see CLAUDE.md).
      # CMAKE_PREFIX_PATH lists the keg-only kegs (openssl@3/libpq/sqlite) plus
      # the Homebrew root so every find_package/find_library resolves.
      - name: Build HMS-CPAP
        run: |
          export CMAKE_PREFIX_PATH="/opt/homebrew:$(brew --prefix openssl@3):$(brew --prefix libpq):$(brew --prefix sqlite):$(brew --prefix jsoncpp)"
          # mysql-client is keg-only, so its mysqlclient.pc is not on the default
          # pkg-config path. Without this the MySQL probe misses and the build
          # fails loudly (by design) rather than silently shipping a binary that
          # accepts database.type="mysql" and then refuses to start.
          export PKG_CONFIG_PATH="$(brew --prefix mysql-client)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          mkdir build && cd build
          # Homebrew ships CMake 4.x, which rejects cmake_minimum_required < 3.5.
          # The miniz 3.0.2 FetchContent dep still declares an old minimum, so
          # allow it (CMake's own suggested fix). Windows sidesteps this by
          # pinning CMake 3.31.
          cmake -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_TESTS=OFF \
            -DBUILD_WITH_WEB=ON \
            -DBUILD_WITH_POSTGRESQL=ON \
            -DBUILD_WITH_MYSQL=ON \
            ..
          cmake --build . --parallel

      # ── Package macOS release ───────────────────────────────────
      - name: Bundle release
        run: |
          mkdir -p release/static/browser
          cp build/hms_cpap release/
          cp -R frontend/dist/frontend/browser/* release/static/browser/
          cat > release/config.example.json <<'EOF'
          {
            "device_id": "cpap_resmed_SERIAL",
            "device_name": "ResMed AirSense 10",
            "source": "ezshare",
            "ezshare_url": "http://192.168.4.1",
            "burst_interval": 65,
            "web_port": 8893,
            "database": { "type": "sqlite" },
            "mqtt": { "enabled": false }
          }
          EOF

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hms-cpap-macos-arm64
          path: release/

  # ── GitHub Release (on tag push) ──────────────────────────────────
  release:
    # windows-build is in `needs` so this job WAITS for the Windows artifact to
    # finish uploading before it tries to download it -- otherwise release only
    # depended on build-and-test and raced ahead, downloading a not-yet-uploaded
    # artifact and publishing an empty release (v4.6.0 shipped with no assets).
    # always() + the explicit build-and-test guard keeps the native builds
    # OPTIONAL: if Windows or macOS fails, release still proceeds (just without
    # that zip).
    if: >-
      always() &&
      needs.build-and-test.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        id: download-windows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hms-cpap-windows-x64
          path: windows-release/

      - name: Create Windows zip
        if: steps.download-windows.outcome == 'success'
        run: |
          cd windows-release
          zip -r ../hms-cpap-windows-x64.zip .

      - name: Download Windows installer
        id: download-installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cpapdash-desktop-setup
          path: ./

      - name: Download macOS artifact
        id: download-macos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hms-cpap-macos-arm64
          path: macos-release/

      - name: Create macOS zip
        if: steps.download-macos.outcome == 'success'
        run: |
          cd macos-release
          zip -r ../hms-cpap-macos-arm64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hms-cpap-windows-x64.zip
            hms-cpap-macos-arm64.zip
            CpapDashDesktop-Setup.exe
